name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install "setuptools>=75,<81" "wheel>=0.44,<1"
      - run: python -m pip install -e ".[dev,ui,release]"
      - run: python -m pytest -q --ignore=tests/test_web_ui_browser.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install "setuptools>=75,<81" "wheel>=0.44,<1"
      - run: python -m pip install -e ".[dev,release]"
      - run: ruff check .
      - run: mypy work_hunter
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - run: python -m build
      - run: python -m pip check
      - run: python -m pip_audit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[dev,browser,ui]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_web_ui_browser.py -q
