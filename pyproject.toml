[project]
name = "work-hunter"
version = "0.1.0"
description = "Personal local job-search command center with MCP tools and a local UI."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
  "requests>=2.32,<3",
  "starlette>=0.27,<0.47",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
  "types-requests>=2.32",
]
browser = [
  "beautifulsoup4>=4.12",
  "playwright>=1.45",
]
ui = [
  "uvicorn>=0.30",
]

[project.scripts]
work-hunter = "work_hunter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["work_hunter*"]
