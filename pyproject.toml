[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "work-hunter"
version = "1.0.0"
description = "Personal local job-search command center with MCP tools and a local UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "requests>=2.32,<3",
  "starlette>=1.3.1,<2",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<3",
  "pytest>=8,<10",
  "ruff>=0.5,<1",
  "types-requests>=2.32",
]
browser = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.45,<2",
]
ui = ["uvicorn>=0.30,<1"]
release = [
  "build>=1.2,<2",
  "pip-audit>=2.10,<3",
]

[project.scripts]
work-hunter = "work_hunter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "restart: recovery behavior after an interrupted HH application request",
  "concurrency: account lease and dispatch concurrency contracts",
]

[tool.setuptools.packages.find]
include = ["work_hunter*"]

[tool.setuptools.package-data]
work_hunter = [
  "migrations/*.sql",
  "web/static/*",
]
